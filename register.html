<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 小魔头Galgame论坛</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1423 0%, #2c1b54 50%, #1a1423 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .top-title {
            width: 100%;
            padding: 40px 20px;
            background: linear-gradient(135deg, #4b2e83, #2c1b54);
            text-align: center;
            border-bottom: 4px solid #c9a8ff;
        }
        .top-title h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 48px;
            letter-spacing: 4px;
            color: #ffe699;
            text-shadow: 3px 3px 8px #000;
        }
        .container {
            max-width: 450px;
            margin: 50px auto;
            padding: 20px;
        }
        .login-box {
            background: rgba(39, 28, 68, 0.95);
            border-radius: 16px;
            padding: 40px;
            border: 2px solid #6348a0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .login-box h2 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 32px;
            color: #ffd878;
            text-align: center;
            margin-bottom: 30px;
            border-left: 5px solid #c9a8ff;
            padding-left: 15px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #e0d4f5;
            font-size: 15px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #3d2e66;
            border-radius: 8px;
            background: #1a1423;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #7c52d6;
            box-shadow: 0 0 20px rgba(124, 82, 214, 0.3);
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #7c52d6, #5e3cad);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'ZCOOL KuaiLe', cursive;
        }
        .submit-btn:hover {
            background: linear-gradient(135deg, #946aff, #7c52d6);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 82, 214, 0.4);
        }
        .submit-btn:disabled {
            background: #5e5e5e;
            cursor: not-allowed;
            transform: none;
        }
        .links {
            text-align: center;
            margin-top: 25px;
            color: #9988bb;
        }
        .links a {
            color: #c9a8ff;
            text-decoration: none;
            transition: color 0.3s;
        }
        .links a:hover { color: #ffd878; }
        .error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #ff6b7a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #7dff9e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .info {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            color: #ffc107;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
        footer {
            text-align: center;
            padding: 25px;
            color: #9988bb;
            font-size: 14px;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="top-title">
        <h1>小魔头Galgame</h1>
    </div>

    <div class="container">
        <div class="login-box">
            <h2>用户注册</h2>

            <div id="message"></div>
            <div id="infoMessage" class="info" style="display:none;">
                ⚠️ Firebase未配置，请先配置Firebase后使用注册功能
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label>昵称</label>
                    <input type="text" id="nickname" placeholder="请输入昵称" required disabled>
                </div>

                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱" required disabled>
                </div>

                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码（至少6位）" required minlength="6" disabled>
                </div>

                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="confirmPassword" placeholder="请再次输入密码" required disabled>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn" disabled>Firebase未配置</button>
            </form>

            <div class="links">
                已有账号？<a href="login.html">立即登录</a>
                <br><br>
                <a href="index.html">← 返回首页</a>
            </div>
        </div>
    </div>

    <footer>
        小魔头Galgame论坛 · 全站免费资源
    </footer>

    <script type="module">
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        let app, auth, database;
        let firebaseInitialized = false;

        try {
            const { initializeApp } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js');
            const { getAuth, createUserWithEmailAndPassword, updateProfile } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js');
            const { getDatabase, ref, set } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js');
            
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            database = getDatabase(app);
            firebaseInitialized = true;
            
            document.querySelectorAll('#registerForm input, #registerForm button').forEach(el => {
                el.disabled = false;
            });
            document.getElementById('submitBtn').textContent = '立即注册';
            document.getElementById('infoMessage').style.display = 'none';

            const registerForm = document.getElementById('registerForm');
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const nickname = document.getElementById('nickname').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    showMessage('两次密码输入不一致', 'error');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '注册中...';

                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    await updateProfile(user, {
                        displayName: nickname
                    });

                    await set(ref(database, 'users/' + user.uid), {
                        nickname: nickname,
                        email: email,
                        role: 0,
                        createdAt: new Date().toISOString()
                    });

                    showMessage('注册成功！正在跳转到首页...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);

                } catch (error) {
                    console.error('注册错误:', error);
                    let errorMessage = '注册失败';
                    
                    switch (error.code) {
                        case 'auth/email-already-in-use':
                            errorMessage = '该邮箱已被注册';
                            break;
                        case 'auth/invalid-email':
                            errorMessage = '邮箱格式不正确';
                            break;
                        case 'auth/weak-password':
                            errorMessage = '密码强度太弱';
                            break;
                        default:
                            errorMessage = error.message;
                    }
                    
                    showMessage(errorMessage, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '立即注册';
                }
            });

        } catch (error) {
            console.error('Firebase初始化失败:', error);
            document.getElementById('infoMessage').style.display = 'block';
            document.getElementById('infoMessage').innerHTML = `
                ⚠️ Firebase未配置<br>
                <small>请查看 FIREBASE-DEPLOY.md 了解如何配置Firebase</small>
            `;
        }

        function showMessage(text, type) {
            document.getElementById('message').innerHTML = `<div class="${type}">${text}</div>`;
        }
    </script>
</body>
</html>
