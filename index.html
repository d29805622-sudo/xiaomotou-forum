<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小魔头Galgame论坛</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1423 0%, #2c1b54 50%, #1a1423 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .top-title {
            width: 100%;
            padding: 40px 20px;
            background: linear-gradient(135deg, #4b2e83, #2c1b54);
            text-align: center;
            border-bottom: 4px solid #c9a8ff;
        }
        .top-title h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 52px;
            letter-spacing: 6px;
            color: #ffe699;
            text-shadow: 3px 3px 8px #000;
        }
        .top-title p {
            font-size: 18px;
            margin-top: 12px;
            color: #e0d4f5;
        }
        .nav {
            display: flex;
            width: 100%;
            background: #251a3d;
        }
        .nav a {
            flex: 1;
            text-align: center;
            padding: 16px 0;
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            border-right: 1px solid #3c2b63;
            transition: background 0.3s;
        }
        .nav a:hover { background: #583ea1; }
        .user-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 12px 20px;
            background: rgba(37, 26, 61, 0.9);
            gap: 15px;
        }
        .user-bar a {
            color: #c9a8ff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            background: #7c52d6;
            transition: all 0.3s;
        }
        .user-bar a:hover { background: #946aff; }
        .user-info { color: #ffd878; font-size: 15px; }
        .main {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            background: rgba(39, 28, 68, 0.8);
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #6348a0;
        }
        .stat-item { text-align: center; }
        .stat-item .num {
            font-size: 32px;
            font-weight: bold;
            color: #ffd878;
        }
        .stat-item .label {
            font-size: 14px;
            color: #9988bb;
            margin-top: 5px;
        }
        .block {
            background: #271c44;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #6348a0;
        }
        .block h2 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 30px;
            color: #ffd878;
            margin-bottom: 20px;
            border-left: 5px solid #c9a8ff;
            padding-left: 15px;
        }
        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #3d2e66;
            transition: background 0.3s;
        }
        .category-item:last-child { border-bottom: none; }
        .category-item:hover { background: rgba(124, 82, 214, 0.1); }
        .category-info h3 {
            font-size: 20px;
            color: #e0d4f5;
            margin-bottom: 8px;
        }
        .category-info p {
            font-size: 14px;
            color: #9988bb;
        }
        .category-stats {
            text-align: right;
            color: #9988bb;
            font-size: 14px;
        }
        .visit-btn {
            background: #7c52d6;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            display: inline-block;
            transition: all 0.3s;
        }
        .visit-btn:hover {
            background: #946aff;
            transform: translateY(-2px);
        }
        footer {
            text-align: center;
            padding: 25px;
            color: #9988bb;
            font-size: 14px;
            margin-top: 40px;
        }
        @media (max-width: 768px) {
            .top-title h1 { font-size: 36px; }
            .stats-bar { flex-direction: column; gap: 15px; }
            .category-item { flex-direction: column; text-align: center; gap: 15px; }
            .category-stats { text-align: center; }
        }
    </style>
</head>
<body>
    <div class="top-title">
        <h1>小魔头Galgame</h1>
        <p>全站免费资源 · 无积分直接下载</p>
    </div>

    <div class="nav">
        <a href="index.html">首页</a>
        <a href="#">动漫专区</a>
        <a href="#">游戏资源</a>
        <a href="#">文件下载</a>
    </div>

    <div id="userBar" class="user-bar">
        <!-- 动态填充 -->
    </div>

    <div class="main">
        <div class="stats-bar">
            <div class="stat-item">
                <div class="num" id="userCount">0</div>
                <div class="label">会员总数</div>
            </div>
            <div class="stat-item">
                <div class="num" id="postCount">0</div>
                <div class="label">帖子总数</div>
            </div>
            <div class="stat-item">
                <div class="num" id="commentCount">0</div>
                <div class="label">评论总数</div>
            </div>
        </div>

        <div class="block">
            <h2>论坛板块</h2>
            <div class="category-item">
                <div class="category-info">
                    <h3>小魔头暴露啦专区</h3>
                    <p>动漫剧情、角色、同人讨论</p>
                    <a href="category.html?id=1" class="visit-btn">进入板块</a>
                </div>
                <div class="category-stats">
                    <div id="cate1Posts">0</div>帖子
                </div>
            </div>
            <div class="category-item">
                <div class="category-info">
                    <h3>Galgame交流区</h3>
                    <p>Galgame玩法、剧情、测评</p>
                    <a href="category.html?id=2" class="visit-btn">进入板块</a>
                </div>
                <div class="category-stats">
                    <div id="cate2Posts">0</div>帖子
                </div>
            </div>
            <div class="category-item">
                <div class="category-info">
                    <h3>游戏包上传下载</h3>
                    <p>Galgame游戏包、补丁、MOD上传下载</p>
                    <a href="category.html?id=3" class="visit-btn">进入板块</a>
                </div>
                <div class="category-stats">
                    <div id="cate3Posts">0</div>帖子
                </div>
            </div>
            <div class="category-item">
                <div class="category-info">
                    <h3>同人创作区</h3>
                    <p>同人文、同人图、剪辑作品</p>
                    <a href="category.html?id=4" class="visit-btn">进入板块</a>
                </div>
                <div class="category-stats">
                    <div id="cate4Posts">0</div>帖子
                </div>
            </div>
        </div>
    </div>

    <footer>
        小魔头Galgame论坛 · 全站免费资源 · 安卓端全屏适配
    </footer>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getDatabase, ref, onValue, get } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js';

        // Firebase 配置
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        const userBar = document.getElementById('userBar');

        // 监听用户状态
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userBar.innerHTML = `
                    <span class="user-info">欢迎，${user.displayName || user.email}</span>
                    <a href="admin.html">管理后台</a>
                    <a href="#" onclick="logout()">退出登录</a>
                `;
            } else {
                userBar.innerHTML = `
                    <a href="login.html">登录</a>
                    <a href="register.html">注册</a>
                `;
            }
        });

        // 加载统计数据
        async function loadStats() {
            try {
                const usersSnapshot = await get(ref(database, 'users'));
                const userCount = usersSnapshot.exists() ? Object.keys(usersSnapshot.val()).length : 0;
                
                const postsSnapshot = await get(ref(database, 'posts'));
                const posts = postsSnapshot.exists() ? postsSnapshot.val() : {};
                const postCount = Object.keys(posts).length;
                
                let commentCount = 0;
                Object.values(posts).forEach(post => {
                    if (post.comments) {
                        commentCount += Object.keys(post.comments).length;
                    }
                });

                document.getElementById('userCount').textContent = userCount;
                document.getElementById('postCount').textContent = postCount;
                document.getElementById('commentCount').textContent = commentCount;

                // 加载各板块帖子数
                for (let i = 1; i <= 4; i++) {
                    const catePosts = Object.values(posts).filter(p => p.cateId == i).length;
                    document.getElementById(`cate${i}Posts`).textContent = catePosts;
                }
            } catch (error) {
                console.error('加载统计数据失败:', error);
            }
        }

        // 登出函数
        window.logout = function() {
            if (confirm('确定要退出登录吗？')) {
                signOut(auth).then(() => {
                    window.location.href = 'index.html';
                }).catch((error) => {
                    console.error('退出登录失败:', error);
                });
            }
        };

        // 页面加载完成后执行
        loadStats();
    </script>
</body>
</html>
