<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布帖子 - 小魔头Galgame论坛</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1423 0%, #2c1b54 50%, #1a1423 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .top-title {
            width: 100%;
            padding: 30px 20px;
            background: linear-gradient(135deg, #4b2e83, #2c1b54);
            text-align: center;
            border-bottom: 4px solid #c9a8ff;
        }
        .top-title h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 42px;
            letter-spacing: 4px;
            color: #ffe699;
            text-shadow: 3px 3px 8px #000;
        }
        .main {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .form-box {
            background: #271c44;
            border-radius: 12px;
            border: 1px solid #6348a0;
            padding: 30px;
        }
        .form-box h2 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 28px;
            color: #ffd878;
            margin-bottom: 25px;
            border-left: 5px solid #c9a8ff;
            padding-left: 15px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #e0d4f5;
            font-size: 15px;
        }
        .form-group input[type="text"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #3d2e66;
            border-radius: 8px;
            background: #1a1423;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .form-group textarea {
            min-height: 200px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #7c52d6;
            box-shadow: 0 0 20px rgba(124, 82, 214, 0.3);
        }
        .file-upload {
            border: 2px dashed #6348a0;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-upload:hover {
            border-color: #7c52d6;
            background: rgba(124, 82, 214, 0.1);
        }
        .file-upload input[type="file"] {
            display: none;
        }
        .file-upload-text {
            color: #9988bb;
            font-size: 14px;
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #7c52d6, #5e3cad);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'ZCOOL KuaiLe', cursive;
        }
        .submit-btn:hover {
            background: linear-gradient(135deg, #946aff, #7c52d6);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 82, 214, 0.4);
        }
        .submit-btn:disabled {
            background: #5e5e5e;
            cursor: not-allowed;
            transform: none;
        }
        .error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #ff6b7a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #7dff9e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #c9a8ff;
            text-decoration: none;
        }
        .back-link:hover { color: #ffd878; }
        footer {
            text-align: center;
            padding: 25px;
            color: #9988bb;
            font-size: 14px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="top-title">
        <h1>小魔头Galgame</h1>
    </div>

    <div class="main">
        <a href="#" onclick="goBack()" class="back-link">← 返回板块</a>

        <div class="form-box">
            <h2>发布帖子</h2>

            <div id="message"></div>

            <form id="postForm">
                <div class="form-group">
                    <label>选择板块</label>
                    <select id="categorySelect" required>
                        <option value="">请选择板块</option>
                        <option value="1">小魔头暴露啦专区</option>
                        <option value="2">Galgame交流区</option>
                        <option value="3">游戏包上传下载</option>
                        <option value="4">同人创作区</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>帖子标题</label>
                    <input type="text" id="title" placeholder="请输入帖子标题" required>
                </div>

                <div class="form-group">
                    <label>帖子内容</label>
                    <textarea id="content" placeholder="请输入帖子内容..." required></textarea>
                </div>

                <div class="form-group">
                    <label>附件上传（可选）</label>
                    <div class="file-upload" onclick="document.getElementById('file').click()">
                        <input type="file" id="file">
                        <div class="file-upload-text" id="fileText">
                            📎 点击选择文件 | 支持任意格式文件
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">发布帖子</button>
            </form>
        </div>
    </div>

    <footer>
        小魔头Galgame论坛 · 全站免费资源
    </footer>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getDatabase, ref, push } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        const params = new URLSearchParams(window.location.search);
        const defaultCateId = params.get('cate_id') || '';

        if (defaultCateId) {
            document.getElementById('categorySelect').value = defaultCateId;
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                showMessage('请先登录后再发帖', 'error');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        });

        document.getElementById('file').addEventListener('change', function() {
            const fileName = this.files[0] ? this.files[0].name : '未选择文件';
            document.getElementById('fileText').textContent = '📎 已选择: ' + fileName;
        });

        const postForm = document.getElementById('postForm');
        const submitBtn = document.getElementById('submitBtn');

        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const user = auth.currentUser;
            if (!user) {
                showMessage('请先登录', 'error');
                return;
            }

            const categoryId = document.getElementById('categorySelect').value;
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const fileInput = document.getElementById('file');

            if (!categoryId || !title || !content) {
                showMessage('请填写所有必填项', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '发布中...';

            try {
                const newPost = {
                    cateId: categoryId,
                    title: title,
                    content: content,
                    authorId: user.uid,
                    authorName: user.displayName || user.email,
                    createdAt: new Date().toISOString(),
                    downloadCount: 0
                };

                const postRef = await push(ref(database, 'posts'), newPost);

                showMessage('发布成功！正在跳转到帖子...', 'success');
                
                setTimeout(() => {
                    window.location.href = `post.html?id=${postRef.key}`;
                }, 1500);

            } catch (error) {
                console.error('发布帖子失败:', error);
                showMessage('发布失败: ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '发布帖子';
            }
        });

        function showMessage(text, type) {
            document.getElementById('message').innerHTML = `<div class="${type}">${text}</div>`;
        }

        window.goBack = function() {
            const categoryId = document.getElementById('categorySelect').value;
            if (categoryId) {
                window.location.href = `category.html?id=${categoryId}`;
            } else {
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>
