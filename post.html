<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情 - 小魔头Galgame论坛</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1423 0%, #2c1b54 50%, #1a1423 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .top-title {
            width: 100%;
            padding: 30px 20px;
            background: linear-gradient(135deg, #4b2e83, #2c1b54);
            text-align: center;
            border-bottom: 4px solid #c9a8ff;
        }
        .top-title h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 42px;
            letter-spacing: 4px;
            color: #ffe699;
            text-shadow: 3px 3px 8px #000;
        }
        .nav {
            display: flex;
            width: 100%;
            background: #251a3d;
        }
        .nav a {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            border-right: 1px solid #3c2b63;
            transition: background 0.3s;
        }
        .nav a:hover { background: #583ea1; }
        .user-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 20px;
            background: rgba(37, 26, 61, 0.9);
            gap: 15px;
        }
        .user-bar a {
            color: #c9a8ff;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            background: #7c52d6;
            transition: all 0.3s;
            font-size: 14px;
        }
        .user-bar a:hover { background: #946aff; }
        .user-info { color: #ffd878; font-size: 14px; }
        .main {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .breadcrumb {
            margin-bottom: 20px;
            font-size: 14px;
            color: #9988bb;
        }
        .breadcrumb a {
            color: #c9a8ff;
            text-decoration: none;
        }
        .breadcrumb a:hover { color: #ffd878; }
        .post-content {
            background: #271c44;
            border-radius: 12px;
            border: 1px solid #6348a0;
            padding: 30px;
            margin-bottom: 20px;
        }
        .post-header {
            border-bottom: 2px solid #3d2e66;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .post-header h2 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 28px;
            color: #ffd878;
            margin-bottom: 15px;
        }
        .post-meta {
            font-size: 14px;
            color: #9988bb;
        }
        .post-meta span { margin-right: 20px; }
        .post-body {
            line-height: 1.8;
            font-size: 16px;
            color: #e0d4f5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .download-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #3d2e66;
        }
        .download-section h3 {
            color: #ffd878;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: #fff;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        .download-btn:hover {
            background: linear-gradient(135deg, #34ce57, #28a745);
            transform: translateY(-2px);
        }
        .comments-section {
            background: #271c44;
            border-radius: 12px;
            border: 1px solid #6348a0;
            padding: 25px;
        }
        .comments-section h3 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 24px;
            color: #ffd878;
            margin-bottom: 20px;
            border-left: 4px solid #c9a8ff;
            padding-left: 12px;
        }
        .comment-form {
            margin-bottom: 25px;
        }
        .comment-form textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #3d2e66;
            border-radius: 8px;
            background: #1a1423;
            color: #fff;
            font-size: 15px;
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }
        .comment-form textarea:focus {
            outline: none;
            border-color: #7c52d6;
        }
        .submit-btn {
            background: linear-gradient(135deg, #7c52d6, #5e3cad);
            color: #fff;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            background: linear-gradient(135deg, #946aff, #7c52d6);
        }
        .submit-btn:disabled {
            background: #5e5e5e;
            cursor: not-allowed;
        }
        .comment-list {
            margin-top: 20px;
        }
        .comment-item {
            padding: 20px;
            border-bottom: 1px solid #3d2e66;
        }
        .comment-item:last-child { border-bottom: none; }
        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .comment-author {
            color: #c9a8ff;
            font-weight: bold;
        }
        .comment-time {
            color: #9988bb;
            font-size: 13px;
        }
        .comment-body {
            line-height: 1.7;
            color: #e0d4f5;
        }
        .empty-comments {
            text-align: center;
            padding: 40px;
            color: #9988bb;
        }
        footer {
            text-align: center;
            padding: 25px;
            color: #9988bb;
            font-size: 14px;
            margin-top: 40px;
        }
        @media (max-width: 768px) {
            .top-title h1 { font-size: 32px; }
            .post-header h2 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="top-title">
        <h1>小魔头Galgame</h1>
    </div>

    <div class="nav">
        <a href="index.html">首页</a>
        <a href="#" id="currentCate">板块</a>
        <a href="#">游戏资源</a>
        <a href="#">文件下载</a>
    </div>

    <div id="userBar" class="user-bar"></div>

    <div class="main">
        <div class="breadcrumb">
            <a href="index.html">首页</a> &gt; 
            <a href="#" id="cateLink">板块</a> &gt; 
            当前帖子
        </div>

        <div id="postContent" class="post-content">
            <div class="post-header">
                <h2 id="postTitle">加载中...</h2>
                <div class="post-meta">
                    <span>作者：<span id="postAuthor"></span></span>
                    <span>发布时间：<span id="postTime"></span></span>
                    <span>下载次数：<span id="downloadCount">0</span></span>
                </div>
            </div>

            <div id="postBody" class="post-body"></div>

            <div id="downloadSection" class="download-section" style="display: none;">
                <h3>📎 附件下载</h3>
                <a href="#" id="downloadBtn" class="download-btn">下载文件</a>
                <div id="downloadInfo" class="download-info"></div>
            </div>
        </div>

        <div class="comments-section">
            <h3>评论 (<span id="commentCount">0</span>)</h3>

            <div id="commentForm" class="comment-form" style="display: none;">
                <textarea id="commentInput" placeholder="写下你的评论..."></textarea>
                <button id="submitComment" class="submit-btn">发表评论</button>
            </div>
            <div id="loginPrompt" style="text-align:center;color:#9988bb;margin-bottom:20px;">
                <a href="login.html" style="color:#c9a8ff;">登录</a>后才能发表评论
            </div>

            <div id="commentList" class="comment-list"></div>
        </div>
    </div>

    <footer>
        小魔头Galgame论坛 · 全站免费资源
    </footer>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getDatabase, ref, get, push, update, increment } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        const categories = {
            '1': '小魔头暴露啦专区',
            '2': 'Galgame交流区',
            '3': '游戏包上传下载',
            '4': '同人创作区'
        };

        const params = new URLSearchParams(window.location.search);
        const postId = params.get('id');

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const userBar = document.getElementById('userBar');
            
            if (user) {
                userBar.innerHTML = `
                    <span class="user-info">欢迎，${user.displayName || user.email}</span>
                    <a href="admin.html">管理后台</a>
                    <a href="#" onclick="logout()">退出</a>
                `;
                document.getElementById('commentForm').style.display = 'block';
                document.getElementById('loginPrompt').style.display = 'none';
            } else {
                userBar.innerHTML = `
                    <a href="login.html">登录</a>
                    <a href="register.html">注册</a>
                `;
                document.getElementById('commentForm').style.display = 'none';
                document.getElementById('loginPrompt').style.display = 'block';
            }
        });

        async function loadPost() {
            try {
                const snapshot = await get(ref(database, `posts/${postId}`));
                
                if (!snapshot.exists()) {
                    document.getElementById('postTitle').textContent = '帖子不存在';
                    return;
                }

                const post = snapshot.val();
                
                document.getElementById('postTitle').textContent = post.title;
                document.getElementById('postAuthor').textContent = post.authorName || '匿名';
                document.getElementById('postTime').textContent = new Date(post.createdAt).toLocaleString('zh-CN');
                document.getElementById('postBody').textContent = post.content;
                document.getElementById('downloadCount').textContent = post.downloadCount || 0;

                const cateId = post.cateId;
                document.getElementById('currentCate').textContent = categories[cateId];
                document.getElementById('cateLink').textContent = categories[cateId];
                document.getElementById('cateLink').href = `category.html?id=${cateId}`;

                if (post.fileUrl) {
                    document.getElementById('downloadSection').style.display = 'block';
                    document.getElementById('downloadBtn').href = post.fileUrl;
                    document.getElementById('downloadInfo').textContent = `文件名：${post.fileName || '附件文件'}`;
                }

                loadComments(post.comments || {});
            } catch (error) {
                console.error('加载帖子失败:', error);
            }
        }

        function loadComments(comments) {
            const commentList = document.getElementById('commentList');
            const commentCount = document.getElementById('commentCount');
            
            const commentArray = Object.entries(comments);
            commentCount.textContent = commentArray.length;

            if (commentArray.length === 0) {
                commentList.innerHTML = '<div class="empty-comments">暂无评论，来抢沙发吧！</div>';
                return;
            }

            commentList.innerHTML = commentArray
                .sort((a, b) => new Date(a[1].createdAt) - new Date(b[1].createdAt))
                .map(([id, comment]) => `
                    <div class="comment-item">
                        <div class="comment-header">
                            <span class="comment-author">${comment.authorName || '匿名'}</span>
                            <span class="comment-time">${timeAgo(comment.createdAt)}</span>
                        </div>
                        <div class="comment-body">${comment.content}</div>
                    </div>
                `).join('');
        }

        document.getElementById('submitComment').addEventListener('click', async () => {
            if (!currentUser) {
                alert('请先登录');
                return;
            }

            const content = document.getElementById('commentInput').value.trim();
            if (!content) {
                alert('请输入评论内容');
                return;
            }

            const newComment = {
                content: content,
                authorId: currentUser.uid,
                authorName: currentUser.displayName || currentUser.email,
                createdAt: new Date().toISOString()
            };

            try {
                await push(ref(database, `posts/${postId}/comments`), newComment);
                document.getElementById('commentInput').value = '';
                loadPost();
            } catch (error) {
                console.error('发表评论失败:', error);
                alert('发表评论失败');
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', async () => {
            try {
                await update(ref(database, `posts/${postId}`), {
                    downloadCount: increment(1)
                });
                document.getElementById('downloadCount').textContent = (parseInt(document.getElementById('downloadCount').textContent) || 0) + 1;
            } catch (error) {
                console.error('更新下载次数失败:', error);
            }
        });

        function timeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = (now - date) / 1000;

            if (diff < 60) return Math.floor(diff) + '秒前';
            if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
            if (diff < 2592000) return Math.floor(diff / 86400) + '天前';
            return date.toLocaleDateString('zh-CN');
        }

        window.logout = function() {
            if (confirm('确定要退出登录吗？')) {
                signOut(auth).then(() => {
                    window.location.href = 'index.html';
                });
            }
        };

        loadPost();
    </script>
</body>
</html>
