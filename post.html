<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情 - 小魔头Galgame论坛</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1423 0%, #2c1b54 50%, #1a1423 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .top-title {
            width: 100%;
            padding: 30px 20px;
            background: linear-gradient(135deg, #4b2e83, #2c1b54);
            text-align: center;
            border-bottom: 4px solid #c9a8ff;
        }
        .top-title h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 42px;
            letter-spacing: 4px;
            color: #ffe699;
            text-shadow: 3px 3px 8px #000;
        }
        .nav {
            display: flex;
            width: 100%;
            background: #251a3d;
        }
        .nav a {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            border-right: 1px solid #3c2b63;
            transition: background 0.3s;
        }
        .nav a:hover { background: #583ea1; }
        .user-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 20px;
            background: rgba(37, 26, 61, 0.9);
            gap: 15px;
        }
        .user-bar a {
            color: #c9a8ff;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            background: #7c52d6;
            transition: all 0.3s;
            font-size: 14px;
        }
        .user-bar a:hover { background: #946aff; }
        .user-info { color: #ffd878; font-size: 14px; }
        .main {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .breadcrumb {
            margin-bottom: 20px;
            font-size: 14px;
            color: #9988bb;
        }
        .breadcrumb a {
            color: #c9a8ff;
            text-decoration: none;
        }
        .breadcrumb a:hover { color: #ffd878; }
        .post-content {
            background: #271c44;
            border-radius: 12px;
            border: 1px solid #6348a0;
            padding: 30px;
            margin-bottom: 20px;
        }
        .post-header {
            border-bottom: 2px solid #3d2e66;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .post-header h2 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 28px;
            color: #ffd878;
            margin-bottom: 15px;
        }
        .post-meta {
            font-size: 14px;
            color: #9988bb;
        }
        .post-meta span { margin-right: 20px; }
        .post-body {
            line-height: 1.8;
            font-size: 16px;
            color: #e0d4f5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .comments-section {
            background: #271c44;
            border-radius: 12px;
            border: 1px solid #6348a0;
            padding: 25px;
        }
        .comments-section h3 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 24px;
            color: #ffd878;
            margin-bottom: 20px;
            border-left: 4px solid #c9a8ff;
            padding-left: 12px;
        }
        .comment-form {
            margin-bottom: 25px;
        }
        .comment-form textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #3d2e66;
            border-radius: 8px;
            background: #1a1423;
            color: #fff;
            font-size: 15px;
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }
        .comment-form textarea:focus {
            outline: none;
            border-color: #7c52d6;
        }
        .submit-btn {
            background: linear-gradient(135deg, #7c52d6, #5e3cad);
            color: #fff;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            background: linear-gradient(135deg, #946aff, #7c52d6);
        }
        .submit-btn:disabled {
            background: #5e5e5e;
            cursor: not-allowed;
        }
        .comment-list {
            margin-top: 20px;
        }
        .comment-item {
            padding: 20px;
            border-bottom: 1px solid #3d2e66;
        }
        .comment-item:last-child { border-bottom: none; }
        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .comment-author {
            color: #c9a8ff;
            font-weight: bold;
        }
        .comment-time {
            color: #9988bb;
            font-size: 13px;
        }
        .comment-body {
            line-height: 1.7;
            color: #e0d4f5;
        }
        .empty-comments {
            text-align: center;
            padding: 40px;
            color: #9988bb;
        }
        footer {
            text-align: center;
            padding: 25px;
            color: #9988bb;
            font-size: 14px;
            margin-top: 40px;
        }
        @media (max-width: 768px) {
            .top-title h1 { font-size: 32px; }
            .post-header h2 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="top-title">
        <h1>小魔头Galgame</h1>
    </div>

    <div class="nav">
        <a href="index.html">首页</a>
        <a href="#" id="currentCate">板块</a>
        <a href="category.html?id=3">游戏资源</a>
        <a href="category.html?id=4">同人创作</a>
    </div>

    <div id="userBar" class="user-bar">
        <a href="login.html">登录</a>
        <a href="register.html">注册</a>
    </div>

    <div class="main">
        <div class="breadcrumb">
            <a href="index.html">首页</a> &gt; 
            <a href="#" id="cateLink">板块</a> &gt; 
            当前帖子
        </div>

        <div id="postContent" class="post-content">
            <div class="post-header">
                <h2 id="postTitle">加载中...</h2>
                <div class="post-meta">
                    <span>作者：<span id="postAuthor"></span></span>
                    <span>发布时间：<span id="postTime"></span></span>
                </div>
            </div>

            <div id="postBody" class="post-body">正在加载内容...</div>
        </div>

        <div class="comments-section">
            <h3>评论 (<span id="commentCount">0</span>)</h3>

            <div id="commentForm" class="comment-form" style="display: none;">
                <textarea id="commentInput" placeholder="写下你的评论..."></textarea>
                <button id="submitComment" class="submit-btn">发表评论</button>
            </div>
            <div id="loginPrompt" style="text-align:center;color:#9988bb;margin-bottom:20px;">
                <a href="login.html" style="color:#c9a8ff;">登录</a>后才能发表评论
            </div>

            <div id="commentList" class="comment-list">
                <div class="empty-comments">加载评论中...</div>
            </div>
        </div>
    </div>

    <footer>
        小魔头Galgame论坛 · 全站免费资源
    </footer>

    <script type="module">
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const categories = {
            '1': '小魔头暴露啦专区',
            '2': 'Galgame交流区',
            '3': '游戏包上传下载',
            '4': '同人创作区'
        };

        const params = new URLSearchParams(window.location.search);
        const postId = params.get('id');

        let app, auth, database;
        let currentUser = null;
        let firebaseInitialized = false;

        try {
            const { initializeApp } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js');
            const { getAuth, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js');
            const { getDatabase, ref, get, push } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js');
            
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            database = getDatabase(app);
            firebaseInitialized = true;

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                const userBar = document.getElementById('userBar');
                
                if (user) {
                    userBar.innerHTML = `
                        <span class="user-info">欢迎，${user.displayName || user.email}</span>
                        <a href="admin.html">管理后台</a>
                        <a href="#" onclick="logout()">退出</a>
                    `;
                    document.getElementById('commentForm').style.display = 'block';
                    document.getElementById('loginPrompt').style.display = 'none';
                }
            });

            loadPost();
        } catch (error) {
            console.error('Firebase初始化失败:', error);
            document.getElementById('postTitle').textContent = '帖子加载失败';
            document.getElementById('postBody').textContent = '⚠️ Firebase未配置，无法加载帖子内容';
            document.getElementById('commentList').innerHTML = '<div class="empty-comments">请先配置Firebase</div>';
        }

        async function loadPost() {
            if (!firebaseInitialized || !postId) {
                document.getElementById('postTitle').textContent = '帖子不存在';
                document.getElementById('postBody').textContent = '请从板块页面选择帖子查看';
                document.getElementById('commentList').innerHTML = '<div class="empty-comments">无帖子信息</div>';
                return;
            }

            try {
                const { getDatabase, ref, get } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js');
                const database = getDatabase(app);
                
                const snapshot = await get(ref(database, `posts/${postId}`));
                
                if (!snapshot.exists()) {
                    document.getElementById('postTitle').textContent = '帖子不存在';
                    document.getElementById('postBody').textContent = '该帖子可能已被删除';
                    return;
                }

                const post = snapshot.val();
                
                document.getElementById('postTitle').textContent = post.title || '无标题';
                document.getElementById('postAuthor').textContent = post.authorName || '匿名';
                document.getElementById('postTime').textContent = post.createdAt ? new Date(post.createdAt).toLocaleString('zh-CN') : '未知';
                document.getElementById('postBody').textContent = post.content || '无内容';

                const cateId = post.cateId;
                if (categories[cateId]) {
                    document.getElementById('currentCate').textContent = categories[cateId];
                    document.getElementById('currentCate').href = `category.html?id=${cateId}`;
                    document.getElementById('cateLink').textContent = categories[cateId];
                    document.getElementById('cateLink').href = `category.html?id=${cateId}`;
                }

                loadComments(post.comments || {});
            } catch (error) {
                console.error('加载帖子失败:', error);
                document.getElementById('postTitle').textContent = '加载失败';
                document.getElementById('postBody').textContent = '加载帖子时发生错误';
            }
        }

        async function loadComments(comments) {
            const commentList = document.getElementById('commentList');
            const commentCount = document.getElementById('commentCount');
            
            const commentArray = Object.entries(comments);
            commentCount.textContent = commentArray.length;

            if (commentArray.length === 0) {
                commentList.innerHTML = '<div class="empty-comments">暂无评论，来抢沙发吧！</div>';
                return;
            }

            commentList.innerHTML = commentArray
                .sort((a, b) => new Date(a[1].createdAt) - new Date(b[1].createdAt))
                .map(([id, comment]) => `
                    <div class="comment-item">
                        <div class="comment-header">
                            <span class="comment-author">${comment.authorName || '匿名'}</span>
                            <span class="comment-time">${timeAgo(comment.createdAt)}</span>
                        </div>
                        <div class="comment-body">${comment.content || ''}</div>
                    </div>
                `).join('');
        }

        document.getElementById('submitComment')?.addEventListener('click', async () => {
            if (!currentUser) {
                alert('请先登录');
                return;
            }

            const content = document.getElementById('commentInput').value.trim();
            if (!content) {
                alert('请输入评论内容');
                return;
            }

            try {
                const { getDatabase, ref, push } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js');
                const database = getDatabase(app);
                
                const newComment = {
                    content: content,
                    authorId: currentUser.uid,
                    authorName: currentUser.displayName || currentUser.email,
                    createdAt: new Date().toISOString()
                };

                await push(ref(database, `posts/${postId}/comments`), newComment);
                document.getElementById('commentInput').value = '';
                loadPost();
            } catch (error) {
                console.error('发表评论失败:', error);
                alert('发表评论失败');
            }
        });

        function timeAgo(dateString) {
            if (!dateString) return '未知时间';
            const date = new Date(dateString);
            const now = new Date();
            const diff = (now - date) / 1000;

            if (diff < 60) return Math.floor(diff) + '秒前';
            if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
            if (diff < 2592000) return Math.floor(diff / 86400) + '天前';
            return date.toLocaleDateString('zh-CN');
        }

        window.logout = async function() {
            if (confirm('确定要退出登录吗？')) {
                const { signOut } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js');
                const { getAuth } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js');
                const { getAuth: getAuthInstance } = { getAuth };
                const authInstance = getAuthInstance(app);
                await signOut(authInstance);
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>
